name: Publish npm package

# Requires Trusted Publisher on npmjs.com:
#   Package → Settings → Trusted Publisher → GitHub Actions
#   User/org: Duaer | Repository: duaer-spec
#   Workflow filename: npm-publish.yml
#   Allowed actions: include "npm publish" (not stage-only)
#
# Needs npm CLI >= 11.5.1 for OIDC Trusted Publishing.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@11
          node -v
          npm -v

      - name: Publish (OIDC Trusted Publishing)
        run: |
          # setup-node may write an empty _authToken placeholder that blocks OIDC
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG" || true
          fi
          npm publish --access public --registry https://registry.npmjs.org/
