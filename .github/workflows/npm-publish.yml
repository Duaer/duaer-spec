name: Publish npm package

# Requires Trusted Publisher on npmjs.com for this package:
#   Package → Settings → Trusted Publisher → GitHub Actions
#   User/org: fujiezee
#   Repository: duaer-spec
#   Workflow filename: npm-publish.yml   ← filename only
#   Allowed actions: npm publish
#
# No NPM_TOKEN secret needed when Trusted Publishing is configured.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs recent npm (bundled with Node 22.14+)
          node-version: '22'
          package-manager-cache: false

      - name: Show tooling
        run: node -v && npm -v

      - name: Publish (OIDC Trusted Publishing)
        run: npm publish --access public --registry https://registry.npmjs.org/
