<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>现场开发</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;700&family=Outfit:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <p class="mark">Live desk · isolated</p>
      <p class="brand">现场开发</p>
      <p class="tag">对话弄清 → 确认卡 → 数字员工开工</p>
      <div class="sight" aria-hidden="true">
        <span class="arm arm-h"></span>
        <span class="arm arm-v"></span>
        <span class="dot"></span>
      </div>
    </header>

    <section id="setup" class="panel setup-panel" hidden>
      <p class="mark">Model · OpenAI-compatible</p>
      <h2 class="card-title">配置模型</h2>
      <p class="hint">写入 <code>~/.duaer/live/config.json</code></p>
      <div class="field">
        <span>服务商</span>
        <div id="cfgProviders" class="provider-row" role="group" aria-label="服务商预设"></div>
      </div>
      <label class="field">
        <span>Base URL</span>
        <input id="cfgBase" type="url" placeholder="https://api.deepseek.com" />
      </label>
      <label class="field">
        <span>API Key</span>
        <input id="cfgKey" type="password" placeholder="sk-…" autocomplete="off" />
      </label>
      <label class="field">
        <span>Model</span>
        <input id="cfgModel" type="text" placeholder="deepseek-flash" />
      </label>
      <button type="button" class="btn confirm" id="saveCfg">保存并开始</button>
      <p id="cfgErr" class="hint" hidden></p>
    </section>

    <main id="desk" class="layout" hidden>
      <section class="panel chat-panel" aria-label="对话">
        <div id="log" class="log"></div>
        <form id="composer" class="composer">
          <label class="sr-only" for="input">你的话</label>
          <textarea
            id="input"
            rows="2"
            placeholder="想做什么…"
            autocomplete="off"
          ></textarea>
          <button type="submit" class="btn primary" id="send">发送</button>
        </form>
      </section>

      <section class="panel card-panel" aria-label="确认卡">
        <p class="mark">Confirm card</p>
        <h2 class="card-title">确认卡</h2>
        <p id="meta" class="meta"></p>
        <label class="field">
          <span>要做什么</span>
          <textarea id="goal" rows="3" placeholder="待确认"></textarea>
        </label>
        <label class="field">
          <span>不做什么</span>
          <textarea id="outOfScope" rows="2" placeholder="待确认"></textarea>
        </label>
        <label class="field">
          <span>验收标准</span>
          <textarea id="acceptance" rows="3" placeholder="待确认"></textarea>
        </label>
        <label class="field">
          <span>假设</span>
          <textarea id="assumptions" rows="2" placeholder="待确认"></textarea>
        </label>
        <p id="lockHint" class="hint">填好目标与验收后确认</p>
        <button type="button" class="btn confirm" id="confirm" disabled>
          需求无误，开始干活
        </button>
        <pre id="result" class="result" hidden></pre>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
