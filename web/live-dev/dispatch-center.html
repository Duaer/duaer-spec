<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>调度中心</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("duaer.live.theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;700&family=Outfit:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=remove-quicknav-1" />
  </head>
  <body class="dispatch-center-page">
    <header class="top">
      <div class="top-row">
        <a class="top-lead top-lead-link" href="/" data-i18n-aria="header.brandProduct" aria-label="Duaer-spec">
          <p class="brand">
            <span data-i18n="header.brandProduct">Duaer-spec</span>
            <span class="brand-fde" data-i18n="header.brandFde">FDE</span>
          </p>
          <p class="flow-line">
            <span class="mark" data-i18n="header.mark">现场开发</span>
            <span class="flow-sep" aria-hidden="true">·</span>
            <span class="tag" data-i18n="header.tag">规范需求 → 可检查验收 → 派工 → 满意成品 → 可继续改进</span>
          </p>
        </a>
        <div class="top-actions">
          <button
            type="button"
            class="top-btn"
            id="dispatchCenterToggle"
            data-i18n="dispatch.center"
            aria-current="page"
          >
            调度中心
          </button>
          <button
            type="button"
            class="top-btn project-badge is-empty"
            id="historyToggle"
            data-i18n-aria="project.toggle"
            aria-label="项目"
          >
            未选项目
          </button>
          <button
            type="button"
            class="top-btn"
            id="employeeToggle"
            data-i18n="employee.toggle"
          >
            数字员工
          </button>
          <button type="button" class="top-btn" id="cfgOpen" data-i18n="setup.open">
            设置
          </button>
          <label class="lang-switch">
            <span class="sr-only" data-i18n="lang.label">语言</span>
            <select id="langSelect" class="top-btn" aria-label="Language">
              <option value="zh-CN">中文</option>
              <option value="zh-TW">繁體中文</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
              <option value="es">Español</option>
              <option value="pt-BR">Português</option>
              <option value="fr">Français</option>
              <option value="de">Deutsch</option>
              <option value="ru">Русский</option>
              <option value="vi">Tiếng Việt</option>
            </select>
          </label>
          <button
            type="button"
            class="top-btn"
            id="themeToggle"
            data-theme="dark"
            aria-pressed="true"
            data-i18n-aria="theme.aria"
            aria-label="切换浅色或深色"
          >
            <span class="theme-icon theme-icon-moon" aria-hidden="true">☾</span>
            <span class="theme-icon theme-icon-sun" aria-hidden="true">☀</span>
            <span id="themeToggleLabel" data-i18n="theme.toLight">浅色</span>
          </button>
          <a
            id="githubStars"
            class="top-btn github-btn"
            href="https://github.com/fujiezee/duaer-spec"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n-aria="github.aria"
            aria-label="GitHub 项目"
          >
            <span data-i18n="github.label">GitHub</span>
            <span class="github-star" aria-hidden="true">★</span>
            <span id="githubStarCount" class="github-count">—</span>
          </a>
        </div>
      </div>
    </header>
    <div id="dispatchCenter" class="dispatch-center">
      <aside class="dispatch-center-rail" data-i18n-aria="dispatch.center" aria-label="调度中心">
        <div id="dispatchCenterProjects"></div>
      </aside>
      <div class="dispatch-center-stage">
        <div class="dispatch-center-views" role="tablist" aria-label="views">
          <button
            type="button"
            class="dispatch-center-view"
            id="dispatchViewGraph"
            role="tab"
            aria-selected="true"
            data-view="graph"
            data-i18n="dispatch.viewGraph"
          >
            派工图
          </button>
          <button
            type="button"
            class="dispatch-center-view"
            id="dispatchViewArch"
            role="tab"
            aria-selected="false"
            data-view="architecture"
            data-i18n="dispatch.viewArchitecture"
          >
            系统架构
          </button>
        </div>
        <p id="dispatchCenterEmpty" class="hint" hidden></p>
        <div id="taskGraphMount" class="task-graph-mount architecture-mount"></div>
      </div>
    </div>
    <script type="module" src="/dispatch-center.js?v=dispatch-no-fs-1"></script>
  </body>
</html>
